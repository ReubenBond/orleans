<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Orleans Active Rebalancing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/site.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.2.0/d3.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #callGraphContainer {
            width: 100%;
            height: 100%;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        circle {
            fill: cadetblue;
        }
        line {
            stroke: #ccc;
        }
        text {
            text-anchor: middle;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            fill: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Active Rebalancing Demo</h1>
    <div id="callGraphContainer">
        <svg>
            <g class="graph-container">
                <g class="links"></g>
                <g class="nodes"></g>
            </g>
        </svg>
    </div>
    
    <script type="text/javascript">
        window.onload = async function () {
            try {
                var data = await fetch('/data.json');
                var jsonData = await data.json();
                onData(jsonData);
            } catch (error) {
                console.error("Error fetching or parsing data:", error);
            }
        }

        function onData(graphData) {
            console.log("Received JSON:", graphData);
            var nodes = graphData.grainIds.map((d, i) => ({ id: i, name: d.name, silo: d.hostKey }));
            var links = graphData.edges.map(d => ({
                source: d.source,
                target: d.target,
                weight: d.weight
            }));

            console.log("Nodes:", nodes);
            console.log("Links:", links);

            var svg = d3.select("svg");
            var graphContainer = svg.select(".graph-container");

            var link = graphContainer.select(".links")
                .selectAll("line")
                .data(links)
                .enter().append("line");

            var node = graphContainer.select(".nodes")
                .selectAll("g")
                .data(nodes)
                .enter().append("g");

            node.append("circle")
                .attr("r", 5);

            node.append("text")
                .text(d => d.name)
                .attr("dy", -10);

            var width = svg.node().clientWidth;
            var height = svg.node().clientHeight;

            var simulation = d3.forceSimulation(nodes)
                .force('charge', d3.forceManyBody().strength(-100))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('link', d3.forceLink(links).id(d => d.id))
                .on('tick', ticked);

            svg.call(d3.zoom()
                .scaleExtent([0.1, 10])
                .on('zoom', function(event) {
                    graphContainer.attr('transform', event.transform);
                }));

            function ticked() {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            }

            // Update the simulation on window resize
            window.addEventListener('resize', () => {
                width = svg.node().clientWidth;
                height = svg.node().clientHeight;
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(1).restart();
            });
        }
    </script>
</body>
</html>
/html>
