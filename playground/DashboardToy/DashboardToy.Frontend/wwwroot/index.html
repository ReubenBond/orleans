<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orleans Active Rebalancing</title>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/site.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.2.0/d3.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #callGraphContainer {
        width: 100%;
        height: 100%;
      }
      svg {
        width: 100%;
        height: 100%;
      }
      text {
        text-anchor: middle;
        font-family: "Helvetica Neue", Helvetica, sans-serif;
        font-size: 16px;
      }
      .host-label-bg {
      }
    </style>
  </head>
  <body>
    <div id="callGraphContainer">
      <svg>
        <rect width="100%" height="100%" fill="white"></rect>
        <g class="graph-container">
          <g class="links"></g>
          <g class="nodes"></g>
        </g>
      </svg>
    </div>
    <script type="text/javascript">
      const state = { nodes: [], links: [], isUpdate: false };
      function mergeObjects(updated, existing) {
        for (let key in existing) {
          if (existing.hasOwnProperty(key) && !updated.hasOwnProperty(key)) {
            updated[key] = existing[key];
          }
        }
      }

      let loadData = async function () {
        try {
          const data = await fetch("/data.json");
          const jsonData = await data.json();
          mergeData(jsonData);
          initializeGraph();
        } catch (error) {
          console.error("Error fetching or parsing data:", error);
        }
      };

      window.onload = async function () {
        await loadData();
      };

      setInterval(async function () {
        state.isUpdate = true;
        await loadData();
      }, 5000);

      function mergeData(jsonData) {
        const newHostNodes = jsonData.hostIds.map((d, i) => ({
          id: "host-" + i,
          name: d.name,
          isHost: true,
          index: i,
          activationCount: d.activationCount,
        }));

        const newGrainNodes = jsonData.grainIds.map((d, i) => ({
          id: "grain-" + d.name,
          host: d.host,
          name: d.name,
          key: d.key,
          isHost: false,
        }));

        const newNodes = newHostNodes.concat(newGrainNodes);

        const newGrainLinks = jsonData.edges
          .map((d) => {
            var source = jsonData.grainIds[d.source];
            var target = jsonData.grainIds[d.target];
            return {
              id: "edge(" + source.name + "," + target.name + ")",
              source: "grain-" + source.name,
              target: "grain-" + target.name,
              sourceHost: source.host,
              targetHost: target.host,
              weight: d.weight,
              isHostLink: false,
            };
          })
          .filter((d) => d.source !== null && d.target !== null);

        const newHostLinks = jsonData.grainIds.map((d, i) => ({
          id: "host-edge(" + d.name + "," + d.host + ")",
          source: "grain-" + d.name,
          target: "host-" + d.host,
          distance: 100,
          isHostLink: true,
          host: d.host,
        }));

        const newLinks = newGrainLinks.concat(newHostLinks);

        // Merge new nodes and links into the existing state
        const nodeMap = new Map(state.nodes.map((d) => [d.id, d]));
        newNodes.forEach((node) => {
          if (nodeMap.has(node.id)) {
            mergeObjects(node, nodeMap.get(node.id));
          }
        });
        state.nodes = Array.from(newNodes);

        const linkMap = new Map(state.links.map((d) => [d.id, d]));
        newLinks.forEach((link) => {
          if (linkMap.has(link.id)) {
            mergeObjects(link, linkMap.get(link.id));
          }
        });
        state.links = Array.from(newLinks);

        state.maxEdgeValue = jsonData.maxEdgeValue;
        state.maxActivationCount = jsonData.maxActivationCount;
      }

      function initializeGraph() {
        const svg = d3.select("svg");
        let width = svg.node().clientWidth;
        let height = svg.node().clientHeight;
        const graphContainer = svg.select(".graph-container");

        const color = d3.scaleOrdinal(d3.schemeCategory10);
        const linkColor = d3
          .scaleSequential(d3.interpolateOrRd)
          .domain([0, state.maxEdgeValue]);

        const nodeData = graphContainer
          .select(".nodes")
          .selectAll("g")
          .data(state.nodes, (d) => d.id);
        const newNodes = nodeData.enter().append("g");
        newNodes.append("circle");
        newNodes.append("text").attr("class", "label");
        newNodes
          .filter((d) => d.isHost)
          .append("text")
          .attr("class", "info");

        newNodes
          .select("text.label")
          .filter((d) => !d.isHost)
          .text((d) => (d.key.includes("hosted-") ? "client" : d.key))
          .attr("dy", -10);
        nodeData.exit().remove();

        const nodeGroup = newNodes.merge(nodeData);

        // Label
        const nodeLabels = nodeGroup
          .select("text.label")
          .filter((d) => d.isHost)
          .text((d) => "[" + d.index + "]")
          .attr("font-weight", "bold")
          .attr("dy", -5);

        // Info
        const nodeInfoLabels = nodeGroup
          .select("text.info")
          .filter((d) => d.isHost)
          .attr("dy", 15)
          .text((d) => d.activationCount);

        // Circle
        nodeGroup
          .select("circle")
          .attr("r", (d) =>
            d.isHost
              ? 10 + (15 * d.activationCount) / state.maxActivationCount
              : 8
          )
          .attr("stroke", "#222")
          .attr("stroke-width", (d) => (d.isHost ? 2 : 1))
          .attr("class", (d) => (d.isHost ? "host-circle" : ""))
          .attr("fill", (d) => (d.isHost ? color(d.index) : color(d.host)));

        // Links
        const linkData = graphContainer
          .select(".links")
          .selectAll("line")
          .data(state.links, (d) => d.id);

        const linkLine = linkData
          .join("line")
          .attr("stroke-width", (d) =>
            d.isHostLink ? 0.25 : 1 + d.weight / state.maxEdgeValue
          )
          .attr("stroke", (d) =>
            d.isHostLink
              ? color(d.host)
              : d.sourceHost == d.targetHost
              ? color(d.sourceHost)
              : "red"
          );
        linkData.exit().remove();

        if (!state.isUpdate) {
          state.simulation = d3
            .forceSimulation(state.nodes)
            .force(
              "center",
              d3.forceCenter(width / 2, height / 2).strength(0.5)
            )
            .force(
              "link",
              d3
                .forceLink(state.links)
                .id((d) => d.id)
                .strength((d) => (d.isHostLink ? 0.6 : 0.3))
                .distance((d) => (d.isHostLink ? 100 : 30))
            )
            .force(
              "hostGravity",
              d3.forceManyBody().strength((d) => (d.isHost ? -50 : -100))
            )
            .alphaDecay(0.01) // Reduce alpha decay rate for gradual settling
            .velocityDecay(0.5) // Reduce velocity decay rate for gradual settling
            .on("tick", ticked);

          svg.call(
            d3
              .zoom()
              .scaleExtent([0.1, 10])
              .on("zoom", (event) => {
                graphContainer.attr("transform", event.transform);
              })
          );
        } else {
          state.simulation.nodes(state.nodes);
          state.simulation.force("link").links(state.links);
          state.simulation.alphaTarget(0.3).restart();
        }

        function ticked() {
          linkLine
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);

          nodeGroup.attr("transform", (d) => `translate(${d.x},${d.y})`);
        }

        window.addEventListener("resize", () => {
          width = svg.node().clientWidth;
          height = svg.node().clientHeight;
          state.simulation.force(
            "center",
            d3.forceCenter(width / 2, height / 2)
          );
          state.simulation.alpha(1).restart();
        });
      }
    </script>
  </body>
</html>
