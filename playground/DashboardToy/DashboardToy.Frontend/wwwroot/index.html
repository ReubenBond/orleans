<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Orleans Active Rebalancing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/site.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.2.0/d3.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #callGraphContainer {
            width: 100%;
            height: 100%;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        circle {
        }
        .host-link{
            stroke: red;
        }
        line {
            stroke: #ccc;
        }
        text {
            text-anchor: middle;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            fill: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Active Rebalancing Demo</h1>
    <div id="callGraphContainer">
        <svg>
            <g class="graph-container">
                <g class="links"></g>
                <g class="nodes"></g>
            </g>
        </svg>
    </div>
    
    <script type="text/javascript">
        window.onload = async function () {
            try {
                var data = await fetch('/data.json');
                var jsonData = await data.json();
                onData(jsonData);
            } catch (error) {
                console.error("Error fetching or parsing data:", error);
            }
        }

        function onData(graphData) {
            console.log("Received JSON:", graphData);

            var hostNodes = graphData.hostIds.map((d, i) => ({ id: 'host-' + i, name: d, isHost: true, index: i }));
            var grainNodes = graphData.grainIds.map((d, i) => ({ id: 'grain-' + i, host: d.host, name: d.name, isHost: false }));
            var nodes = hostNodes.concat(grainNodes);

            // Create a map to find nodes by their names
            var nodeMap = {};
            nodes.forEach(node => { nodeMap[node.name] = node; });

            var grainLinks = graphData.edges.map(d => ({
                source: 'grain-' + d.source,
                target: 'grain-' + d.target,
                weight: 100 * (d.weight / graphData.maxEdgeValue),
            })).filter(d => d.source !== null && d.target !== null);
            var hostLinks = graphData.grainIds.map((d, i) => ({
                source: 'grain-' + i,
                target: 'host-' + d.host,
                weight: 1
            }));

            var links = grainLinks.concat(hostLinks);

            console.log("Nodes:", nodes);
            console.log("Links:", links);

            var svg = d3.select("svg");
            var graphContainer = svg.select(".graph-container");

            var color = d3.scaleOrdinal(d3.schemeCategory10);

            var link = graphContainer.select(".links")
                .selectAll("line")
                .data(links)
                .enter().append("line");

            var node = graphContainer.select(".nodes")
                .selectAll("g")
                .data(nodes)
                .enter().append("g");

            node.append("circle")
                .filter(d => d.isHost)
                .attr("r", d => 10)
                .attr("class", d => "host-circle")
                .attr("fill", d => color(d.index));

            node.append("circle")
                .filter(d => !d.isHost)
                .attr("r", d => 5)
                .attr("class", d => "")
                .attr("fill", d => color(d.host));

            node.append("text")
                .text(d => d.name)
                .attr("dy", -10);

            var width = svg.node().clientWidth;
            var height = svg.node().clientHeight;

            var simulation = d3.forceSimulation(nodes)
                //.force('charge', d3.forceManyBody().strength(d => -500))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('link', d3.forceLink(links).id(d => d.id))
                .force('hostGravity', grainGravitationForce(nodes, hostNodes))
                .on('tick', ticked);

            svg.call(d3.zoom()
                .scaleExtent([0.1, 10])
                .on('zoom', function(event) {
                    graphContainer.attr('transform', event.transform);
                }));

            function ticked() {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            }

            // Update the simulation on window resize
            window.addEventListener('resize', () => {
                width = svg.node().clientWidth;
                height = svg.node().clientHeight;
                simulation.force('center', d3.forceCenter(width / 2, height / 2));
                simulation.alpha(1).restart();
            });
        }

        function grainGravitationForce(nodes, hostNodes) {
            return d3.forceManyBody()
                .strength(d => {
                    if (d.isHost) return 0;
                    var hostNode = hostNodes.find(host => host.name === d.host);
                    return hostNode ? -1000 : -500;
                })
                .distanceMin(10)
                .distanceMax(200);
        }
    </script>
</body>
</html>
