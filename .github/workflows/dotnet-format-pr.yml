#
# This workflow suggests .NET code formatting changes in pull requests when a member/owner/collaborator comments
# '/format' on the PR. Instead of automatically committing changes, it posts diff suggestions as comments.
#

name: Suggest .NET code formatting

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  dotnet-format:
    name: Run dotnet-format
    runs-on: ubuntu-latest

    # Only run on PR comments that contain the trigger phrase
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/format') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'))

    steps:
      - name: React to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch and checkout PR branch
        if: github.event_name == 'issue_comment'
        run: |
          # Fetch the PR branch using the PR number - this works for both forks and same-repo PRs
          git fetch origin pull/${{ github.event.issue.number }}/head:pr-branch
          git checkout pr-branch

      - name: Use current branch for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Using current branch: $(git branch --show-current)"
          echo "Current commit: $(git rev-parse HEAD)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Find .NET projects
        id: find-projects
        run: |
          # Find all solution files first
          solutions=$(find ./ -name "*.sln" -o -name "*.slnx" 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]*$//')

          if [[ -n "$solutions" ]]; then
            echo "projects=$solutions" >> $GITHUB_OUTPUT
            echo "Found solutions: $solutions"
          else
            # Fallback to individual projects (excluding test projects for performance)
            projects=$(find ./ -name "*.csproj" 2>/dev/null | grep -v -E "(Test|Tests)" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            if [[ -n "$projects" ]]; then
              echo "projects=$projects" >> $GITHUB_OUTPUT
              echo "Found projects: $projects"
            else
              echo "projects=" >> $GITHUB_OUTPUT
              echo "No .NET projects found in ./ directory"
            fi
          fi

      - name: Restore dependencies
        if: steps.find-projects.outputs.projects != ''
        run: |
          success=true
          for project in ${{ steps.find-projects.outputs.projects }}; do
            echo "Restoring $project"
            if ! dotnet restore "$project" --verbosity minimal; then
              echo "Warning: Failed to restore $project"
              success=false
            fi
          done
          if [ "$success" = "false" ]; then
            echo "Some projects failed to restore, but continuing with formatting"
          fi

      - name: Run dotnet format
        if: steps.find-projects.outputs.projects != ''
        run: |
          # Apply formatting to all found projects
          success=true
          for project in ${{ steps.find-projects.outputs.projects }}; do
            echo "Formatting $project"
            if ! dotnet format "$project" --verbosity diagnostic; then
              echo "Warning: Failed to format $project"
              success=false
            fi
          done
          if [ "$success" = "false" ]; then
            echo "Some projects failed to format, checking for any changes that were made"
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No formatting changes needed"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Formatting changes detected"
            git diff --name-only
          fi

      - name: Generate formatting diff
        if: steps.changes.outputs.has_changes == 'true'
        id: diff
        run: |
          # Generate individual file diffs in a structured format
          mkdir -p file_diffs

          # Get list of changed files
          git diff --name-only > changed_files.txt

          # For each changed file, save the formatted version and basic diff info
          file_counter=0
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              echo "Processing diff for: $file"

              # Use counter to avoid filename collisions
              file_counter=$((file_counter + 1))
              safe_name="file_${file_counter}_$(basename "$file" | tr '/' '_')"

              # Save a simple diff for line counting
              git diff "$file" > "file_diffs/${safe_name}.diff"

              # Save the original (before formatting) content
              git show HEAD:"$file" > "file_diffs/${safe_name}.orig" 2>/dev/null || touch "file_diffs/${safe_name}.orig"

              # Get the full content of the new (formatted) file
              cp "$file" "file_diffs/${safe_name}.new"

              # Store the original file path for reference
              echo "$file" > "file_diffs/${safe_name}.path"
            fi
          done < changed_files.txt

          # Create a summary
          echo "Changed files:" > diff_summary.txt
          cat changed_files.txt >> diff_summary.txt
          echo "" >> diff_summary.txt
          echo "Total files changed: $(wc -l < changed_files.txt)" >> diff_summary.txt

          {
            echo 'DIFF_SUMMARY<<EOF'
            cat diff_summary.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Upload formatting patch
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: |
            file_diffs/
            changed_files.txt
            diff_summary.txt
          retention-days: 30

      - name: Comment on PR (success)
        if: github.event_name == 'issue_comment' && steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // First, post a summary comment
            const diffSummary = `${{ steps.diff.outputs.DIFF_SUMMARY }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔧 **Code formatting suggestions found!**\n\n${diffSummary}\n\n` +
                    `I'll post suggestions on the changed lines that you can apply directly using GitHub's suggestion feature.\n\n` +
                    `💡 *Tip: You can also run \`dotnet format\` locally or download the \`formatting-patch\` artifact.*`
            });

            // Get PR details for creating review comments
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Read the list of changed files
            const changedFiles = fs.readFileSync('changed_files.txt', 'utf8').trim().split('\n').filter(f => f);

            // Parse diff files and create suggestions
            const reviewComments = [];

            // Build a mapping of files to their safe names
            const fileMapping = new Map();
            for (let i = 0; i < changedFiles.length; i++) {
              const filePath = changedFiles[i];
              if (!filePath.trim()) continue;

              const fileCounter = i + 1;
              const safeName = `file_${fileCounter}_${path.basename(filePath).replace(/\//g, '_')}`;
              fileMapping.set(filePath, safeName);
            }

            for (const filePath of changedFiles) {
              if (!filePath.trim()) continue;

              try {
                // Read the safe name for this file
                const safeName = fileMapping.get(filePath);
                const origPath = `file_diffs/${safeName}.orig`;
                const newPath = `file_diffs/${safeName}.new`;
                const diffPath = `file_diffs/${safeName}.diff`;

                if (!fs.existsSync(origPath) || !fs.existsSync(newPath)) continue;

                // Read the original and new file contents
                const origContent = fs.readFileSync(origPath, 'utf8');
                const newContent = fs.readFileSync(newPath, 'utf8');
                const diffContent = fs.readFileSync(diffPath, 'utf8');

                // Split into lines for processing
                const origLines = origContent.split('\n');
                const newLines = newContent.split('\n');

                // Parse the diff to find change regions
                const diffLines = diffContent.split('\n');
                const changeRegions = [];

                for (let i = 0; i < diffLines.length; i++) {
                  const line = diffLines[i];

                  // Look for hunk headers like @@ -1,10 +1,12 @@
                  const hunkMatch = line.match(/^@@ -(\d+),?(\d+)? \+(\d+),?(\d+)? @@/);
                  if (hunkMatch) {
                    const startLine = parseInt(hunkMatch[1]);
                    const oldCount = parseInt(hunkMatch[2] || '1');
                    const newStartLine = parseInt(hunkMatch[3]);
                    const newCount = parseInt(hunkMatch[4] || '1');

                    // Collect all lines in this hunk
                    let j = i + 1;
                    let hasChanges = false;
                    let firstChangeOffset = -1;
                    let lastChangeOffset = -1;

                    while (j < diffLines.length && !diffLines[j].startsWith('@@')) {
                      if (diffLines[j].startsWith('-') || diffLines[j].startsWith('+')) {
                        hasChanges = true;
                        if (firstChangeOffset === -1) {
                          firstChangeOffset = j - i - 1;
                        }
                        lastChangeOffset = j - i - 1;
                      }
                      j++;
                    }

                    if (hasChanges) {
                      // Calculate the actual range of changes in the original file
                      let contextLinesBefore = 0;
                      let contextLinesAfter = 0;
                      let changeStartLine = startLine;
                      let changeEndLine = startLine + oldCount - 1;

                      // Count context lines before first change
                      for (let k = i + 1; k < i + 1 + firstChangeOffset; k++) {
                        if (diffLines[k] && diffLines[k].startsWith(' ')) {
                          contextLinesBefore++;
                        }
                      }

                      // Count lines after last change
                      for (let k = i + 1 + lastChangeOffset + 1; k < j; k++) {
                        if (diffLines[k] && diffLines[k].startsWith(' ')) {
                          contextLinesAfter++;
                        }
                      }

                      // Adjust the range to exclude pure context lines
                      changeStartLine += contextLinesBefore;
                      changeEndLine -= contextLinesAfter;

                      // Make sure we have valid line numbers
                      if (changeEndLine < changeStartLine) {
                        changeEndLine = changeStartLine;
                      }

                      changeRegions.push({
                        startLine: changeStartLine,
                        endLine: changeEndLine,
                        newStartLine: newStartLine + contextLinesBefore,
                        newEndLine: newStartLine + newCount - contextLinesAfter - 1
                      });
                    }
                  }
                }

                // Create suggestions for each change region
                for (const region of changeRegions) {
                  // For GitHub suggestions, we need to provide the complete content
                  // that should replace the lines in the range [startLine, endLine]

                  // Extract the new content for this region
                  const suggestionLines = [];
                  const newStartIdx = region.newStartLine - 1;
                  const newEndIdx = region.newEndLine - 1;

                  for (let idx = newStartIdx; idx <= newEndIdx && idx < newLines.length; idx++) {
                    suggestionLines.push(newLines[idx]);
                  }

                  // GitHub's suggestion format requires the content without a trailing newline
                  // unless the original selection ended with a newline
                  let suggestionContent = suggestionLines.join('\n');

                  // Check if we need a trailing newline
                  const origEndIdx = region.endLine - 1;
                  if (origEndIdx < origLines.length - 1 ||
                      (origEndIdx === origLines.length - 1 && origContent.endsWith('\n'))) {
                    suggestionContent += '\n';
                  }

                  console.log(`Creating suggestion for ${filePath} lines ${region.startLine}-${region.endLine}:`);
                  console.log(`  Original line count: ${region.endLine - region.startLine + 1}`);
                  console.log(`  New line count: ${suggestionLines.length}`);
                  console.log(`  Suggestion content length: ${suggestionContent.length} characters`);

                  const commentObj = {
                    path: filePath,
                    body: `\`\`\`suggestion\n${suggestionContent}\`\`\``,
                    line: region.endLine
                  };

                  // Add start_line for multi-line suggestions
                  if (region.startLine !== region.endLine) {
                    commentObj.start_line = region.startLine;
                  }

                  reviewComments.push(commentObj);
                }

                // If no changes were parsed (fallback for edge cases)
                if (reviewComments.filter(c => c.path === filePath).length === 0) {
                  console.log(`Warning: No suggestions created for ${filePath}, using fallback`);
                  reviewComments.push({
                    path: filePath,
                    body: `**Unable to create precise suggestion.** Please run \`dotnet format\` locally or download the artifact to apply formatting changes.`,
                    line: 1
                  });
                }
              } catch (error) {
                console.log(`Error processing file ${filePath}: ${error.message}`);
                console.log(`Stack trace: ${error.stack}`);
                // Fallback to issue comment for this file
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## 📝 Formatting for \`${filePath}\` (manual application needed)\n\n` +
                        `Unable to create automatic suggestion: ${error.message}\n\n` +
                        `Please run \`dotnet format\` or copy from the artifact.`
                });
              }
            }

            // Submit the review with suggestions
            if (reviewComments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: pr.data.head.sha,
                  body: `## 🔧 Code Formatting Suggestions\n\n` +
                        `I've found formatting improvements for ${reviewComments.length} location(s). ` +
                        `Each suggestion below can be applied directly by clicking "Apply suggestion".`,
                  event: 'COMMENT',
                  comments: reviewComments
                });
              } catch (reviewError) {
                console.log(`Error creating review: ${reviewError.message}`);
                // Fallback to a simple comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## 🔧 Code Formatting Results\n\n` +
                        `Found ${reviewComments.length} formatting suggestion(s), but couldn't create review comments:\n` +
                        `\`\`\`\n${reviewError.message}\n\`\`\`\n\n` +
                        `Please download the \`formatting-patch\` artifact or run \`dotnet format\` locally.`
                });
              }
            }

      - name: Log formatting results (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Formatting changes detected!"
            echo "📁 Changed files:"
            cat changed_files.txt
            echo ""
            echo "📋 Diff summary:"
            cat diff_summary.txt
            echo ""
            echo "💡 Download the 'formatting-patch' artifact to apply these changes."
          else
            echo "✅ No formatting changes needed. Code is already properly formatted."
          fi

      - name: Comment on PR (no projects found)
        if: github.event_name == 'issue_comment' && steps.find-projects.outputs.projects == ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **No .NET projects found!**\n\nCould not find any .NET solution files (.sln/.slnx) or project files (.csproj) in the `./dotnet` directory to format.'
            });

      - name: Comment on PR (no changes)
        if: github.event_name == 'issue_comment' && steps.changes.outputs.has_changes == 'false' && steps.find-projects.outputs.projects != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Code formatting check completed!**\n\nNo formatting changes were needed. The code is already properly formatted.'
            });

      - name: Update status on failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Auto-formatting failed!**\n\nThere was an error while trying to format the code. Please check the workflow logs for details and try running `dotnet format` locally.'
            });
