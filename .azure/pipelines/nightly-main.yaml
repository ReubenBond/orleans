trigger: none
pr: none

schedules:
- cron: "0 0 * * *"
  displayName: Daily midnight build (including CodeQL)
  branches:
    include:
    - main
  always: true

jobs:
- template: build.yaml
  parameters:
    build_configuration: Release
    include_suffix: true
    version_suffix: nightly.$(Build.BuildNumber)
    codesign: true
    skip_test: true
